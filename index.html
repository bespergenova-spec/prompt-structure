<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Планер задач</title>
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --text:#1c2230; --muted:#6b7385; --line:#e2e6ee;
  --accent:#3b6ef6; --accent-ink:#ffffff; --danger:#d93f3f; --warn:#c77a0a; --hover:#eef2fb;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171d; --panel:#1c2029; --text:#e6e9f0; --muted:#8f98ab; --line:#2b3140;
    --accent:#6f95ff; --accent-ink:#0d1220; --danger:#ff6b6b; --warn:#f0a93b; --hover:#242a37; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 24px}
header{display:flex;align-items:center;gap:8px;margin:2px 0 8px;position:relative}
header h1{font-size:16px;margin:0;flex:1}
header h1 small{font-weight:400;color:var(--muted);margin-left:6px}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.hbtn:hover{background:var(--hover)}
.hbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.menu{position:absolute;right:0;top:34px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:20;min-width:180px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:2px 10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:5px}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip b{font-weight:400;opacity:.7;font-size:12px}
#qa{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.qtop{display:flex;gap:6px;align-items:center}
#qText{border:0;outline:0;background:none;padding:4px 2px;font-size:15px;flex:1;min-width:0}
.qrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qrow .grow{flex:1}
.ctl,.dt input[type=text],.t{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:4px 14px;font-weight:600;cursor:pointer}
.dt{position:relative;display:inline-flex;align-items:center;gap:2px}
.dt input[type=text]{width:92px}
.dt .pk{position:absolute;left:0;bottom:0;width:0;height:0;opacity:0;pointer-events:none;border:0;padding:0}
.cal{border:0;background:none;cursor:pointer;padding:0 2px;font-size:14px}
.t{width:56px;text-align:center}
.bad{border-color:var(--danger)!important}
.late{color:var(--danger);font-weight:600}
.soon{color:var(--warn);font-weight:600}
.group h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 5px;font-weight:600}
.group h3.bad{color:var(--danger)}
.row{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:8px;padding:5px 8px;margin-bottom:5px}
.row:hover{border-color:var(--accent)}
.row .top{display:flex;align-items:center;gap:8px}
.row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer}
.row .title{flex:1;min-width:0;border:0;background:none;outline:0;padding:3px 2px;border-radius:4px;font-size:14px}
.row .title:focus{background:var(--hover)}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.row .meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:2px 0 1px 25px}
.row .meta .dt input[type=text],.row .meta .t{background:none;border-color:transparent;font-size:12px;padding:1px 4px;color:var(--muted)}
.row .meta .dt input[type=text]:hover,.row .meta .t:hover,.row .meta .dt input[type=text]:focus,.row .meta .t:focus{border-color:var(--line)}
.row .meta .dt input[type=text].late,.row .meta .t.late{color:var(--danger);font-weight:600}
.row .meta .dt input[type=text].soon,.row .meta .t.soon{color:var(--warn);font-weight:600}
.row .meta .dt input[type=text]{width:84px}
.row .meta .t{width:46px}
.row select.cat{border:0;border-radius:10px;padding:1px 4px;font-size:12px;cursor:pointer}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:0 6px}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;opacity:0;padding:0 5px;border-radius:5px}
.row:hover .del{opacity:1}
.del:hover{color:var(--danger);background:var(--hover)}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.donebar{display:flex;align-items:center;margin:16px 2px 6px}
.donebar button.tg{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:13px}
.donebar button.tg:hover{color:var(--text)}
.donebar .clr{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50;max-width:92vw}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--text);width:min(600px,96vw);max-height:94vh}
dialog::backdrop{background:rgba(10,12,18,.5)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:92vh}
.dlg h2{margin:0;font-size:16px}
.dlg label{font-size:12px;color:var(--muted)}
.dlg input[type=text],.dlg textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px}
.dlg textarea{min-height:70px;resize:vertical}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--hover)}
.btns{display:flex;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.files{display:flex;gap:6px;flex-wrap:wrap}
.file{font-size:12px;background:var(--hover);border-radius:10px;padding:2px 9px;cursor:pointer}
.cands{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:80px}
.cand{display:grid;grid-template-columns:20px 1fr;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.cand.dup{opacity:.6}
.cand input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.cand .ttl{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px;width:100%}
.cand .meta{grid-column:2;display:flex;gap:6px;align-items:center}
.cand .src{grid-column:2;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Мои задачи<small id="count"></small></h1>
    <button class="hbtn primary" id="btnImport" title="Достать мои задачи из протокола Word">Из протокола</button>
    <button class="hbtn" id="btnMenu" title="Копия данных">⋯</button>
    <div class="menu" id="menu" hidden>
      <button id="btnExport">Сохранить копию</button>
      <button id="btnRestore">Загрузить копию</button>
    </div>
    <input type="file" id="restoreFile" accept=".json" hidden>
  </header>

  <div class="chips" id="chips"></div>

  <form id="qa" autocomplete="off">
    <div class="qtop">
      <input type="text" id="qText" placeholder="Новая задача… например «отчёт до 15.11 в 14:00»" autofocus>
      <button type="submit" class="add">Добавить</button>
    </div>
    <div class="qrow" id="qrow">
      <select class="ctl" id="qCat"></select>
      <span class="grow"></span>
    </div>
  </form>

  <div id="list"></div>

  <div class="donebar">
    <button class="tg" id="toggleDone"></button>
    <button class="clr" id="clearDone" hidden>очистить закрытые</button>
  </div>
  <div id="doneList" hidden></div>
</div>

<dialog id="imp">
  <div class="dlg" id="impA">
    <h2>Задачи из протокола</h2>
    <div>
      <label for="myNames">Как вас называют в протоколах (имя и фамилия; подойдёт любое сочетание, инициалы, склонения)</label>
      <input type="text" id="myNames">
    </div>
    <div class="drop" id="drop">Перетащите сюда протокол Word (.docx) или нажмите, чтобы выбрать<br><small>Подойдут также .txt и .md; можно несколько файлов</small></div>
    <input type="file" id="impFile" accept=".docx,.txt,.md,.csv,text/plain" multiple hidden>
    <div class="files" id="pending"></div>
    <div>
      <label for="pasteText">…или вставьте текст протокола (например, из PDF)</label>
      <textarea id="pasteText"></textarea>
    </div>
    <div class="btns">
      <button class="btn" id="impCancel">Отмена</button>
      <button class="btn primary" id="impRun">Найти мои задачи</button>
    </div>
  </div>
  <div class="dlg" id="impB" hidden>
    <h2 id="impTitle">Найдено</h2>
    <div class="cands" id="cands"></div>
    <div class="btns">
      <button class="btn" id="impBack">Назад</button>
      <button class="btn primary" id="impAdd">Добавить</button>
    </div>
  </div>
</dialog>

<script>
'use strict';
/* ---------- данные ---------- */
const KEY = 'planner.v1';
const DEFAULT_NAME = 'Еспергенова Балнур';
const CATS = [
  {id:'work',   name:'Работа',   color:'#3b82f6'},
  {id:'health', name:'Здоровье', color:'#22c55e'},
  {id:'family', name:'Семья',    color:'#ec4899'},
  {id:'friends',name:'Друзья',   color:'#f59e0b'},
  {id:'home',   name:'Дом',      color:'#8b5cf6'},
];
const catOf = id => CATS.find(c => c.id === id) || CATS[0];
let state = {tasks: [], settings: {names: DEFAULT_NAME}};
let ui = {cat: 'all', showDone: false};

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.tasks)) state = {tasks: s.tasks, settings: Object.assign({names: DEFAULT_NAME}, s.settings)};
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Не удалось сохранить в браузере — нажмите ⋯ → «Сохранить копию»'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- даты и время ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayISO = () => iso(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDate = s => s ? `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}` : '';
const MONTH_STEMS = ['январ','феврал','март','апрел','ма[яй]','июн','июл','август','сентябр','октябр','ноябр','декабр'];
const PREFIX = '(?:(?:в\\s+срок\\s+)?(?:до|к)|не\\s+позднее|срок(?:\\s+исполнения)?\\s*[:\\-–—]?)\\s*';

function mkISO(y,m,d){
  const dt = new Date(y, m-1, d);
  return (dt.getMonth() === m-1 && dt.getDate() === d) ? iso(dt) : null;
}
function guessYear(m,d){
  const now = new Date(); let y = now.getFullYear();
  if((now - new Date(y,m-1,d)) / 864e5 > 90) y++;
  return y;
}
/* дата, введённая руками: 10.11.2026, 10.11.26, 10.11 → ISO; '' пусто; null — не распознано */
function parseUserDate(s){
  s = s.trim(); if(!s) return '';
  const m = /^(\d{1,2})[./\-](\d{1,2})(?:[./\-](\d{2}|\d{4}))?$/.exec(s); if(!m) return null;
  let y = m[3] ? +m[3] : guessYear(+m[2], +m[1]); if(y < 100) y += 2000;
  return mkISO(y, +m[2], +m[1]);
}
/* время, введённое руками: 9, 9:30, 9.30, 0930 → 'HH:MM' */
function normTime(s){
  s = s.trim(); if(!s) return '';
  let h, m;
  let r = /^(\d{1,2})$/.exec(s); if(r){ h = +r[1]; m = 0; }
  else if((r = /^(\d{1,2})[:.\-](\d{2})$/.exec(s))){ h = +r[1]; m = +r[2]; }
  else if((r = /^(\d{1,2})(\d{2})$/.exec(s))){ h = +r[1]; m = +r[2]; }
  else return null;
  return (h < 24 && m < 60) ? pad(h) + ':' + pad(m) : null;
}
/* Ищет дату в тексте. opts.relative — «сегодня/завтра», opts.bare — вся строка может быть датой без года */
function parseDate(s, opts = {}){
  let m;
  m = new RegExp('(?<![\\d.])(?:'+PREFIX+')?(\\d{1,2})[./](\\d{1,2})[./](\\d{4}|\\d{2})(?!\\d)','iu').exec(s);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; const r = mkISO(y,+m[2],+m[1]); if(r) return {iso:r, text:m[0]}; }
  m = new RegExp('(?<!\\d)(?:'+PREFIX+')?(\\d{1,2})\\s+('+MONTH_STEMS.join('|')+')\\p{L}*(?:\\s+(\\d{4})(?!\\d))?','iu').exec(s);
  if(m){
    const mi = MONTH_STEMS.findIndex(st => new RegExp('^'+st,'i').test(m[2]));
    const y = m[3] ? +m[3] : guessYear(mi+1, +m[1]);
    const r = mkISO(y, mi+1, +m[1]); if(r) return {iso:r, text:m[0]};
  }
  m = new RegExp('(?<![\\d.])'+PREFIX+'(\\d{1,2})[./](\\d{1,2})(?![\\d]|[./]\\d)','iu').exec(s);
  if(m){ const r = mkISO(guessYear(+m[2],+m[1]), +m[2], +m[1]); if(r) return {iso:r, text:m[0]}; }
  if(opts.bare){
    m = /^\s*(\d{1,2})[./](\d{1,2})\s*$/.exec(s);
    if(m){ const r = mkISO(guessYear(+m[2],+m[1]), +m[2], +m[1]); if(r) return {iso:r, text:m[0]}; }
  }
  if(opts.relative){
    m = /(?<!\p{L})(сегодня|завтра|послезавтра)(?!\p{L})/iu.exec(s);
    if(m){ const k = {'сегодня':0,'завтра':1,'послезавтра':2}[m[1].toLowerCase()]; return {iso: iso(addDays(new Date(), k)), text:m[0]}; }
  }
  return null;
}
/* время в тексте: «в 14:00», «10:30» */
function parseTime(s){
  const m = /(?<![\p{L}\d.:])(?:(?:в|к|до|на)\s+)?([01]?\d|2[0-3]):([0-5]\d)(?![\d:])/iu.exec(s);
  return m ? {time: pad(+m[1]) + ':' + m[2], text: m[0]} : null;
}

/* ---------- мелкие помощники ---------- */
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k === 'class') e.className = v;
    else if(k === 'text') e.textContent = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  e.append(...kids);
  return e;
}
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg, actionText, action){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('div', {class:'toast'}, el('span', {text: msg}));
  if(actionText) t.append(el('button', {text: actionText, onclick: () => { action(); t.remove(); }}));
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 6000);
}
const tint = hex => hex + '30';
const flashBad = inp => { inp.classList.add('bad'); setTimeout(() => inp.classList.remove('bad'), 900); };
const blurOnEnter = e => { if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); } };

/* поле даты (дд.мм.гггг + календарь) и поле времени (чч:мм) */
function dateField(val, onCommit, cls = ''){
  const txt = el('input', {type:'text', class:cls, value:fmtDate(val), placeholder:'дд.мм.гггг', title:'Срок, например 10.11.2026',
    onkeydown: blurOnEnter,
    onchange: e => {
      const r = parseUserDate(e.target.value);
      if(r === null){ e.target.value = fmtDate(val); flashBad(e.target); return; }
      e.target.value = fmtDate(r); val = r; onCommit(r);
    }});
  const pick = el('input', {type:'date', class:'pk', value:val || '', tabIndex:-1,
    onchange: e => { txt.value = fmtDate(e.target.value); val = e.target.value; onCommit(val); }});
  const btn = el('button', {type:'button', class:'cal', title:'Выбрать в календаре', textContent:'📅',
    onclick: () => { try{ pick.showPicker(); }catch(_){ pick.focus(); } }});
  return el('span', {class:'dt'}, txt, btn, pick);
}
function timeField(val, onCommit, cls = ''){
  return el('input', {type:'text', class:'t ' + cls, value:val || '', placeholder:'чч:мм', title:'Время (необязательно), например 14:30',
    onkeydown: blurOnEnter,
    onchange: e => {
      const r = normTime(e.target.value);
      if(r === null){ e.target.value = val || ''; flashBad(e.target); return; }
      e.target.value = r; val = r; onCommit(r);
    }});
}

/* ---------- список ---------- */
function mutate(fn){ fn(); save(); render(); }
const isLate = t => !t.done && t.due && (t.due < todayISO() || (t.due === todayISO() && t.time && t.time < nowHM()));
const byDue = (a,b) => (a.due || '9999').localeCompare(b.due || '9999') ||
  (a.time || '99:99').localeCompare(b.time || '99:99') || a.created - b.created;
const inCat = t => ui.cat === 'all' || t.cat === ui.cat;

function rowFor(t){
  const c = catOf(t.cat);
  const cls = isLate(t) ? 'late' : (!t.done && t.due === todayISO() ? 'soon' : '');
  const sel = el('select', {class:'cat', title:'Вид задачи', onchange: e => mutate(() => { t.cat = e.target.value; })});
  CATS.forEach(k => sel.append(el('option', {value:k.id, text:k.name, selected:k.id === t.cat})));
  sel.style.background = tint(c.color);
  const meta = el('div', {class:'meta'}, sel,
    dateField(t.due, v => mutate(() => { t.due = v; if(!v) t.time = ''; }), cls),
    timeField(t.time, v => mutate(() => { t.time = v; if(v && !t.due) t.due = todayISO(); }), cls));
  if(t.src) meta.append(el('span', {class:'badge', text:'протокол', title:'Из: ' + t.src}));
  const row = el('div', {class:'row' + (t.done ? ' done' : ''), style:'border-left-color:' + c.color},
    el('div', {class:'top'},
      el('input', {type:'checkbox', checked:t.done, title: t.done ? 'Открыть снова' : 'Закрыть',
        onchange: e => mutate(() => { t.done = e.target.checked; t.closedAt = t.done ? Date.now() : null; })}),
      el('input', {class:'title', type:'text', value:t.title, onkeydown: blurOnEnter,
        onchange: e => { const v = e.target.value.trim(); mutate(() => { if(v) t.title = v; }); }}),
      el('button', {class:'del', text:'×', title:'Удалить', onclick: () => {
        const idx = state.tasks.indexOf(t);
        mutate(() => state.tasks.splice(idx,1));
        toast('Задача удалена', 'Отменить', () => mutate(() => state.tasks.splice(idx,0,t)));
      }})),
    meta);
  return row;
}

function render(){
  const openAll = state.tasks.filter(t => !t.done);
  $('count').textContent = openAll.length ? `открыто: ${openAll.length}` : '';

  // виды
  const chips = $('chips'); chips.replaceChildren();
  const n = id => openAll.filter(t => id === 'all' || t.cat === id).length;
  const chip = (id, name, color) => el('button', {class:'chip' + (ui.cat === id ? ' on' : ''), type:'button',
    onclick: () => { ui.cat = id; if(id !== 'all') $('qCat').value = id; render(); }},
    ...(color ? [el('i', {style:'background:' + color})] : []), name, el('b', {text: n(id) || ''}));
  chips.append(chip('all', 'Все'), ...CATS.map(c => chip(c.id, c.name, c.color)));

  // открытые задачи по срокам
  const today = todayISO(), week = iso(addDays(new Date(), 7));
  const open = openAll.filter(inCat).sort(byDue);
  const groups = [
    {name:'Просрочено', bad:true, items: open.filter(isLate)},
    {name:'Сегодня', items: open.filter(t => t.due === today && !isLate(t))},
    {name:'Ближайшие 7 дней', items: open.filter(t => t.due > today && t.due <= week)},
    {name:'Позже', items: open.filter(t => t.due > week)},
    {name:'Без срока', items: open.filter(t => !t.due)},
  ].filter(g => g.items.length);
  const list = $('list'); list.replaceChildren();
  if(!groups.length) list.append(el('div', {class:'empty', text:'Открытых задач нет'}));
  for(const g of groups){
    list.append(el('section', {class:'group'}, el('h3', {class: g.bad ? 'bad' : '', text: `${g.name} · ${g.items.length}`}),
      ...g.items.map(rowFor)));
  }

  // закрытые
  const done = state.tasks.filter(t => t.done && inCat(t)).sort((a,b) => (b.closedAt||0) - (a.closedAt||0));
  $('toggleDone').textContent = (ui.showDone ? '▾ ' : '▸ ') + `Закрытые · ${done.length}`;
  $('clearDone').hidden = !(ui.showDone && done.length);
  const dl = $('doneList'); dl.hidden = !ui.showDone; dl.replaceChildren();
  if(ui.showDone) done.forEach(t => dl.append(rowFor(t)));
}
$('toggleDone').onclick = () => { ui.showDone = !ui.showDone; render(); };
$('clearDone').onclick = () => {
  const gone = state.tasks.filter(t => t.done && inCat(t));
  if(!confirm(`Удалить закрытые задачи: ${gone.length}? Это нельзя отменить.`)) return;
  mutate(() => { state.tasks = state.tasks.filter(t => !gone.includes(t)); });
};

/* ---------- быстрый ввод ---------- */
let qDue = '', qTime = '';
const qDateEl = dateField('', v => { qDue = v; });
const qTimeEl = timeField('', v => { qTime = v; });
$('qrow').insertBefore(qDateEl, $('qrow').querySelector('.grow'));
$('qrow').insertBefore(qTimeEl, $('qrow').querySelector('.grow'));
CATS.forEach(c => $('qCat').append(el('option', {value:c.id, text:c.name})));

$('qa').addEventListener('submit', e => {
  e.preventDefault();
  let text = $('qText').value.trim(); if(!text) return;
  let due = qDue, time = qTime;
  const t = parseTime(text);
  if(t){ if(!time) time = t.time; text = text.replace(t.text, ' '); }
  const d = parseDate(text, {relative:true});
  if(d){ if(!due) due = d.iso; text = text.replace(d.text, ' '); }
  if(t || d){
    const cleaned = text.replace(/\s{2,}/g,' ').replace(/^[\s,;:—–-]+|[\s,;:—–-]+$/g,'');
    text = cleaned.length >= 2 ? cleaned : $('qText').value.trim();
  }
  if(time && !due) due = todayISO();
  const cat = $('qCat').value;
  if(ui.cat !== 'all') ui.cat = cat;
  mutate(() => state.tasks.push({id:uid(), title:text, cat, due, time, done:false, created:Date.now(), closedAt:null}));
  $('qText').value = ''; qDue = qTime = '';
  qDateEl.querySelector('input[type=text]').value = ''; qTimeEl.value = '';
  $('qText').focus();
});

/* ---------- меню и копия данных ---------- */
$('btnMenu').onclick = e => { e.stopPropagation(); $('menu').hidden = !$('menu').hidden; };
document.addEventListener('click', () => { $('menu').hidden = true; });
$('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  const a = el('a', {href: URL.createObjectURL(blob), download: `planner-${todayISO()}.json`});
  document.body.append(a); a.click(); a.remove();
};
$('btnRestore').onclick = () => $('restoreFile').click();
$('restoreFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const s = JSON.parse(await f.text());
    if(!Array.isArray(s.tasks)) throw 0;
    if(!confirm(`Заменить текущие задачи (${state.tasks.length}) задачами из копии (${s.tasks.length})?`)) return;
    state = {tasks: s.tasks, settings: Object.assign({names: DEFAULT_NAME}, s.settings)};
    save(); render(); toast('Копия загружена');
  }catch(err){ toast('Это не файл копии планера'); }
};

/* ---------- импорт протоколов ---------- */
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const letters = s => (s.match(/\p{L}/gu) || []).length;

/* Из «Еспергенова Балнур» делает поиск по: фамилии, имени, любому их сочетанию (в т.ч. в падежах)
   и по инициалам: «Еспергенова Б.», «Б. Еспергенова», «Е.Б.», «Б.Е.» */
function nameMatcher(){
  const words = state.settings.names.match(/\p{L}{2,}/gu) || [];
  if(!words.length) return null;
  const stems = words.filter(w => w.length >= 3).map(w =>
    escRe(w.length > 4 && /[аяйь]$/i.test(w) ? w.slice(0, -1) : w));
  const INI = '[А-ЯЁA-Z]\\.\\s*';
  const parts = [];
  if(stems.length) parts.push('(?:' + INI + '){0,2}(?:' + stems.join('|') + ')\\p{L}{0,3}(?:\\s*[А-ЯЁA-Z]\\.\\s*(?:[А-ЯЁA-Z]\\.)?)?');
  const ini = words.map(w => escRe(w[0])), pairs = [];
  ini.forEach((a,i) => ini.forEach((b,j) => { if(i !== j) pairs.push(a + '\\.\\s*' + b + '\\.?'); }));
  if(pairs.length) parts.push('(?:' + pairs.join('|') + ')');
  const src = '(?<!\\p{L})(?:' + parts.join('|') + ')(?!\\p{L})';
  const test = new RegExp(src, 'iu'), all = new RegExp(src, 'giu');
  return {test: s => test.test(s), strip: s => s.replace(all, ' ')};
}
const LABEL = /(?:ответственн\p{L}*|исполнител\p{L}*|отв\.?|исп\.?)\s*[:\-–—]/giu;
const stripLabels = s => s.replace(LABEL, ' ');

function cleanText(s){
  s = s.replace(/\(\s*[,;:–—-]*\s*\)|\[\s*[,;:–—-]*\s*\]/g, ' ')
       .replace(/^\s*(?:\d+(?:\.\d+)+\.?|\d+[.)]|[-–—•*·▪●])\s*/u, '')
       .replace(/\s+([,;:.])/g, '$1')
       .replace(/\s{2,}/g, ' ')
       .replace(/^[\s,;:.\-–—)]+|[\s,;:\-–—(]+$/g, '')
       .replace(/[.;,]+$/, '').trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* вырезает из строки время и дату */
function splitDT(s){
  const t = parseTime(s);
  if(t) s = s.replace(t.text, ' ');
  const d = parseDate(s, {bare:true});
  if(d) s = s.replace(d.text, ' ');
  return {s, date: d ? d.iso : '', time: t ? t.time : ''};
}

const SKIP = /^(?:присутствова|присутствуют|участник|приглашен|отсутствова|список|повестк|подпис|составил|секретар|протокол\s*№)/iu;

function extract(text, src){
  const re = nameMatcher(); if(!re) return [];
  const lines = text.replace(/\r/g, '').split('\n').map(s => s.trim());
  const out = [], seen = new Set();
  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    if(line.length < 4 || !re.test(line)) continue;
    if(SKIP.test(line.replace(/^\s*(?:\d+[.)]|[-–—•*·▪●])\s*/u, ''))) continue;

    let body = line, orig = line, due = '', time = '';
    const only = cleanText(splitDT(re.strip(stripLabels(line))).s);
    if(letters(only) < 4){                       // строка вида «Ответственный: Еспергенова» — задача выше
      let j = i - 1; while(j >= 0 && !lines[j]) j--;
      if(j < 0) continue;
      body = lines[j]; orig = lines[j] + '  ⟵  ' + line;
      for(let k = i + 1; k <= i + 2 && k < lines.length; k++){
        if(/срок/i.test(lines[k])){ const x = splitDT(lines[k]); if(x.date){ due = x.date; time = x.time; break; } }
      }
    }

    let title = '';
    if(/\||\t/.test(body)){                      // строка таблицы
      const texts = [];
      for(const c of body.split(/\s*\|\s*|\t+/).map(s => s.trim()).filter(Boolean)){
        const x = splitDT(c);
        if(x.date || x.time){ due = due || x.date; time = time || x.time; }
        if(letters(x.s) < 3) continue;           // ячейка — только дата/время/номер
        const t = cleanText(re.strip(stripLabels(x.s)));
        if(letters(t) >= 3) texts.push(t);
      }
      title = texts.sort((a,b) => b.length - a.length)[0] || '';
    }else{
      const x = splitDT(body); due = due || x.date; time = time || x.time;
      title = cleanText(re.strip(stripLabels(x.s)));
    }

    const words = title.split(/[\s,;]+/).filter(Boolean);
    if(letters(title) < 4) continue;
    if(words.length >= 2 && words.every(w => /^[А-ЯЁA-Z]/.test(w))) continue;   // просто список фамилий
    const key = title.toLowerCase();
    if(seen.has(key)) continue; seen.add(key);
    out.push({title, due, time: due ? time : '', line: orig.length > 170 ? orig.slice(0,170) + '…' : orig, src});
  }
  return out;
}

/* чтение файлов */
async function readText(file){
  const buf = await file.arrayBuffer();
  let s = new TextDecoder('utf-8').decode(buf);
  if(s.includes('�')) s = new TextDecoder('windows-1251').decode(buf);
  return s;
}
async function inflate(u8){
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).text();
}
async function readDocx(file){
  const buf = await file.arrayBuffer(), u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22;
  while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) throw new Error('это не файл .docx');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true), xml = null;
  const dec = new TextDecoder();
  for(let i = 0; i < n; i++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    if(dec.decode(u8.subarray(p + 46, p + 46 + nl)) === 'word/document.xml'){
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      const data = u8.subarray(start, start + csize);
      xml = method === 0 ? dec.decode(data) : await inflate(data);
      break;
    }
    p += 46 + nl + xl + cl;
  }
  if(!xml) throw new Error('в файле нет текста документа');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const para = pEl => {
    let s = '';
    for(const n of pEl.getElementsByTagNameNS(W, '*')){
      if(n.localName === 't') s += n.textContent;
      else if(n.localName === 'tab' || n.localName === 'br') s += ' ';
    }
    return s.trim();
  };
  const lines = [];
  const body = doc.getElementsByTagNameNS(W, 'body')[0];
  for(const ch of body.children){
    if(ch.localName === 'p') lines.push(para(ch));
    else if(ch.localName === 'tbl'){
      for(const tr of ch.getElementsByTagNameNS(W, 'tr')){
        const cells = [...tr.children].filter(c => c.localName === 'tc').map(tc =>
          [...tc.children].filter(c => c.localName === 'p').map(para).filter(Boolean).join(' '));
        lines.push(cells.join(' | '));
      }
    }
  }
  return lines.join('\n');
}
async function readFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.docx')) return readDocx(file);
  if(name.endsWith('.doc')) throw new Error('старый формат .doc — сохраните файл как .docx');
  if(name.endsWith('.pdf')) throw new Error('для .pdf скопируйте текст и вставьте в поле ниже');
  return readText(file);
}

/* окно импорта */
let pending = [], cands = [];
const dlg = $('imp');
function showStep(b){ $('impA').hidden = b; $('impB').hidden = !b; }
function renderPending(){
  $('pending').replaceChildren(...pending.map((p, i) => el('span', {class:'file', text: p.name + '  ×',
    title:'Убрать', onclick: () => { pending.splice(i,1); renderPending(); }})));
}
$('btnImport').onclick = () => {
  $('myNames').value = state.settings.names; pending = []; renderPending(); $('pasteText').value = '';
  showStep(false); dlg.showModal();
};
$('impCancel').onclick = () => dlg.close();
$('impBack').onclick = () => showStep(false);
$('myNames').addEventListener('change', e => { state.settings.names = e.target.value.trim(); save(); });
$('drop').onclick = () => $('impFile').click();
['dragenter','dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => addFiles(e.dataTransfer.files));
$('impFile').onchange = e => { addFiles(e.target.files); e.target.value = ''; };

async function addFiles(files){
  for(const f of files){
    try{ pending.push({name: f.name, text: await readFile(f)}); }
    catch(err){ toast(`${f.name}: ${err.message}`); }
  }
  renderPending();
  if(pending.length && $('myNames').value.trim()) runImport();
  else if(!$('myNames').value.trim()) $('myNames').focus();
}

function runImport(){
  state.settings.names = $('myNames').value.trim(); save();
  if(!state.settings.names){ $('myNames').focus(); toast('Укажите ваше имя или фамилию'); return; }
  const sources = [...pending];
  if($('pasteText').value.trim()) sources.push({name:'вставленный текст', text:$('pasteText').value});
  if(!sources.length){ toast('Добавьте файл или вставьте текст'); return; }
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
  const existing = new Set(state.tasks.map(t => norm(t.title)));
  cands = sources.flatMap(s => extract(s.text, s.name)).map(c => ({...c, dup: existing.has(norm(c.title))}));
  cands.forEach(c => c.on = !c.dup);
  renderCands(); showStep(true);
}
$('impRun').onclick = runImport;

function renderCands(){
  const box = $('cands'); box.replaceChildren();
  $('impTitle').textContent = cands.length ? `Найдено задач: ${cands.length}` : 'Ничего не найдено';
  if(!cands.length){
    box.append(el('div', {class:'empty', text:'Строк с вашим именем не нашлось. Проверьте, как имя записано в протоколе.'}));
  }
  cands.forEach(c => {
    box.append(el('div', {class:'cand' + (c.dup ? ' dup' : '')},
      el('input', {type:'checkbox', checked:c.on, onchange: e => { c.on = e.target.checked; updAdd(); }}),
      el('input', {type:'text', class:'ttl', value:c.title, onchange: e => { c.title = e.target.value.trim() || c.title; }}),
      el('div', {class:'meta'}, dateField(c.due, v => { c.due = v; if(!v) c.time = ''; }), timeField(c.time, v => { c.time = v; })),
      el('div', {class:'src', title:c.line, text: (c.dup ? 'Уже есть в планере · ' : '') + c.src + ': ' + c.line})));
  });
  updAdd();
}
function updAdd(){
  const n = cands.filter(c => c.on).length;
  $('impAdd').textContent = `Добавить в «Работа»: ${n}`;
  $('impAdd').disabled = !n;
}
$('impAdd').onclick = () => {
  const chosen = cands.filter(c => c.on);
  mutate(() => chosen.forEach(c => state.tasks.push({id:uid(), title:c.title, cat:'work', due:c.due || '',
    time: c.due ? (c.time || '') : '', done:false, created:Date.now(), closedAt:null, src:c.src})));
  dlg.close(); ui.cat = 'work'; $('qCat').value = 'work'; render();
  toast(`Добавлено задач: ${chosen.length}`);
};

/* ---------- старт ---------- */
load(); render();
setInterval(() => { if(!dlg.open && !document.activeElement?.matches('input,select')) render(); }, 60000);  // обновляет «просрочено»
</script>
